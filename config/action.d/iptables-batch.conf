# Fail2Ban configuration file
#
# Atomic batched iptables action.
#
# A stable dispatcher chain (f2b-<name>) points at one of two generation
# chains (f2b-<name>-a / f2b-<name>-b).  A batch is built into the inactive
# generation with a single iptables-restore transaction.  Only after that
# succeeds is the dispatcher's jump atomically replaced with -R.  If the
# build fails, packets continue to use the previous generation unchanged.

[INCLUDES]

before = iptables.conf

[Definition]

actionstart = { <iptables> -C f2b-<name> -m comment --comment f2b-dispatch -j RETURN >/dev/null 2>&1; } \
              || { <iptables> -N f2b-<name> >/dev/null 2>&1 || true; <iptables> -A f2b-<name> -m comment --comment f2b-dispatch -j RETURN; }
              <iptables> -N f2b-<name>-a >/dev/null 2>&1 || true
              <iptables> -N f2b-<name>-b >/dev/null 2>&1 || true
              <_ipt_add_rules>

actioncheck = <iptables> -C f2b-<name> -m comment --comment f2b-dispatch -j RETURN >/dev/null 2>&1 \
              && <iptables> -S f2b-<name>-a >/dev/null 2>&1 \
              && <iptables> -S f2b-<name>-b >/dev/null 2>&1 \
              && { active=""; \
                   <iptables> -C f2b-<name> -j f2b-<name>-a >/dev/null 2>&1 && active=f2b-<name>-a || true; \
                   <iptables> -C f2b-<name> -j f2b-<name>-b >/dev/null 2>&1 && active=f2b-<name>-b || true; \
                   [ -z "$active" ] || [ "$(<iptables> -S "$active" | grep -c '^-A ')" -gt 0 ]; }

actionrepair = <iptables> -N f2b-<name> >/dev/null 2>&1 || true
               <iptables> -F f2b-<name>
               <iptables> -A f2b-<name> -m comment --comment f2b-dispatch -j RETURN
               <iptables> -N f2b-<name>-a >/dev/null 2>&1 || true
               <iptables> -F f2b-<name>-a
               <iptables> -N f2b-<name>-b >/dev/null 2>&1 || true
               <iptables> -F f2b-<name>-b
               <_ipt_add_rules>

actionbatchban = set -e; \
                 active=""; \
                 <iptables> -C f2b-<name> -j f2b-<name>-a >/dev/null 2>&1 && active=f2b-<name>-a || true; \
                 <iptables> -C f2b-<name> -j f2b-<name>-b >/dev/null 2>&1 && active=f2b-<name>-b || true; \
                 if [ "$active" = f2b-<name>-a ]; then new=f2b-<name>-b; else new=f2b-<name>-a; fi; \
                 <iptables> -N "$new" >/dev/null 2>&1 || true; \
                 tmp=$(mktemp "${TMPDIR:-/tmp}/f2b-batch.XXXXXX"); \
                 first=1; count=0; \
                 flush_chunk() { \
                   if [ "$first" = 1 ]; then flush_first=1; first=0; else flush_first=0; fi; \
                   { echo '*filter'; \
                     if [ "$flush_first" = 1 ]; then echo "-F $new"; fi; \
                     cat "$tmp"; echo 'COMMIT'; \
                   } | <iptables-restore> --noflush || { rm -f "$tmp"; exit 1; }; \
                   : > "$tmp"; count=0; \
                 }; \
                 while IFS= read -r ip; do \
                   printf -- '-A %%s -s %%s -j %%s\n' "$new" "$ip" "<blocktype>" >> "$tmp"; \
                   count=$((count + 1)); \
                   if [ "$count" -ge <batchchunksize> ]; then flush_chunk; fi; \
                 done < "<ip-list-file>"; \
                 if [ "$count" -gt 0 ]; then flush_chunk; fi; \
                 rm -f "$tmp"; \
                 if [ -n "$active" ]; then \
                   <iptables> -R f2b-<name> 1 -j "$new"; \
                 else \
                   <iptables> -I f2b-<name> 1 -j "$new"; \
                 fi

actionban = set -e; \
            active=""; \
            <iptables> -C f2b-<name> -j f2b-<name>-a >/dev/null 2>&1 && active=f2b-<name>-a || true; \
            <iptables> -C f2b-<name> -j f2b-<name>-b >/dev/null 2>&1 && active=f2b-<name>-b || true; \
            [ -n "$active" ] || { active=f2b-<name>-a; <iptables> -N "$active" >/dev/null 2>&1 || true; <iptables> -I f2b-<name> 1 -j "$active"; }; \
            <iptables> -I "$active" 1 -s <ip> -j <blocktype>

actionunban = for chain in f2b-<name>-a f2b-<name>-b; do \
                <iptables> -D "$chain" -s <ip> -j <blocktype> >/dev/null 2>&1 || true; \
              done

actionflush = <iptables> -F f2b-<name>-a >/dev/null 2>&1 || true
              <iptables> -F f2b-<name>-b >/dev/null 2>&1 || true
              <iptables> -F f2b-<name> >/dev/null 2>&1 || true

actionstop = <_ipt_del_rules>
             <actionflush>
             <iptables> -X f2b-<name>-a >/dev/null 2>&1 || true
             <iptables> -X f2b-<name>-b >/dev/null 2>&1 || true
             <iptables> -X f2b-<name> >/dev/null 2>&1 || true

[Init]

# iptables-restore is part of the same iptables package and commits the
# staged generation in one transaction.
iptables-restore = iptables-restore <lockingopt>
# Keep each iptables-restore transaction below the kernel netlink message
# limit.  The inactive generation is still switched only once, after every
# chunk has succeeded.
batchchunksize = 500

[Init?family=inet6]

iptables-restore = ip6tables-restore <lockingopt>
